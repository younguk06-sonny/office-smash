<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d8bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>무한의 계단</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#7fd3ff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}
.cbtn.hintb{animation:hintb .6s infinite alternate}
@keyframes hintb{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.35);transform:scale(1.06)}}
#tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 160px);text-align:center;font-weight:900;font-size:clamp(16px,4.6vw,20px);text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;letter-spacing:-.5px}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;white-space:nowrap}
.hide{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
#hudRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#btnPause{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.28);font-size:20px;font-weight:900}
#coinBox{background:rgba(0,0,0,.28);padding:7px 12px;border-radius:14px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff59d,#ffca28 45%,#f9a825);box-shadow:inset 0 0 0 2px #f57f17;flex:none}
#score{font-size:clamp(44px,13vw,72px);font-weight:900;text-align:center;line-height:1;margin-top:2px;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.15);letter-spacing:-1px}
#gaugeWrap{margin:8px auto 0;width:min(78vw,360px);height:18px;border-radius:10px;background:rgba(0,0,0,.35);padding:3px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#gauge{height:100%;border-radius:7px;background:linear-gradient(90deg,#ff5252,#ffca28 35%,#69f0ae);width:100%;transform-origin:left}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;font-weight:900;font-size:clamp(26px,8vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;letter-spacing:-1px;white-space:nowrap}
#banner small{display:block;font-size:.5em;margin-top:6px;opacity:.95}
#banner.show{animation:ban 1.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
/* controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 14px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none}
.cbtn{pointer-events:auto;width:min(40vw,170px);height:min(40vw,170px);max-height:120px;border-radius:28px;font-weight:900;font-size:clamp(17px,5vw,22px);letter-spacing:-1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .05s}
.cbtn .ic{font-size:clamp(28px,9vw,40px);line-height:1}
.cbtn:active,.cbtn.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
#btnTurn{background:linear-gradient(#ff8a65,#f4511e)}
#btnUp{background:linear-gradient(#4fc3f7,#1e88e5)}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);background:rgba(10,20,60,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{background:rgba(255,255,255,.96);color:#24304a;border-radius:26px;padding:18px;width:min(92vw,420px);box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.25);text-align:center}
.title{font-size:clamp(40px,12.5vw,60px);font-weight:900;letter-spacing:-3px;line-height:1.05;color:#fff;text-shadow:0 4px 0 #1e5bb8,0 8px 0 rgba(0,0,0,.2);white-space:nowrap}
.title span{color:#ffd54f}
.sub{color:#fff;font-weight:800;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.25);font-size:15px;white-space:nowrap}
.big{width:100%;padding:16px 10px;border-radius:18px;font-size:clamp(20px,6vw,24px);font-weight:900;letter-spacing:-1px;box-shadow:0 6px 0 rgba(0,0,0,.2);margin-top:10px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.b-go{background:linear-gradient(#66bb6a,#2e7d32);color:#fff}
.b-blue{background:linear-gradient(#64b5f6,#1e88e5);color:#fff}
.b-org{background:linear-gradient(#ffb74d,#f57c00);color:#fff}
.b-gray{background:#e3e8f2;color:#3a4766}
.b-pink{background:linear-gradient(#f48fb1,#d81b60);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stat{display:flex;justify-content:center;gap:10px;margin:6px 0 2px;flex-wrap:nowrap}
.chip{background:#eef3ff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;color:#2b3a5e}
#preview{display:block;margin:2px auto 0;width:150px;height:170px}
.pvRow{display:flex;align-items:center;justify-content:center;gap:6px}
.arrow{width:44px;height:44px;border-radius:50%;background:#eef3ff;color:#3a4766;font-size:20px;font-weight:900}
#pvName{font-weight:900;font-size:19px;margin-top:-4px;letter-spacing:-.5px;white-space:nowrap}
.seg{display:flex;background:#eef3ff;border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-weight:900;font-size:15px;color:#6b7896;background:none;letter-spacing:-.5px}
.seg button.on{background:#fff;color:#1e88e5;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.tog{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tog button{background:#eef3ff;color:#3a4766;border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px}
.tog button.off{opacity:.45}
.hint{font-size:12.5px;color:#7a86a3;margin-top:10px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
/* shop */
#shop{justify-content:flex-start}
#shopHead{width:min(96vw,560px);display:flex;align-items:center;gap:8px;margin-bottom:8px}
#shopHead h2{flex:1;font-size:24px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:-1px;white-space:nowrap}
#shopHead .coinchip{background:rgba(0,0,0,.3);padding:7px 11px;border-radius:12px;font-weight:900;display:flex;gap:5px;align-items:center;white-space:nowrap}
.xbtn{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.3);font-size:20px;font-weight:900}
#gachaBtn{width:min(96vw,560px);margin:0 0 10px;padding:12px;font-size:19px}
#grid{width:min(96vw,560px);flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;padding-bottom:20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card{background:rgba(255,255,255,.95);border-radius:16px;padding:6px 4px 7px;color:#24304a;text-align:center;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.card canvas{width:84px;height:94px;display:block;margin:0 auto}
.card .nm{font-weight:900;font-size:13px;letter-spacing:-.6px;white-space:nowrap;overflow:hidden}
.card .st{font-size:11.5px;font-weight:900;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;letter-spacing:-.4px}
.card .st .coin{width:13px;height:13px}
.card.sel{outline:4px solid #ffca28}
.card.lock canvas{filter:brightness(.15) saturate(0);opacity:.7}
.card.lock{background:rgba(235,240,250,.92)}
.st.own{color:#2e7d32}.st.sel{color:#f57c00}.st.price{color:#3a4766}.st.need{color:#8e24aa}
/* modal */
#modal{z-index:20}
#modal .panel{width:min(86vw,340px)}
#mText{font-weight:900;font-size:19px;margin:6px 0 4px;letter-spacing:-.5px}
#mCanvas{width:150px;height:170px;display:block;margin:0 auto}
/* records */
#recList{list-style:none;margin-top:8px;max-height:52vh;overflow-y:auto}
#recList li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;font-weight:800;font-size:15px;white-space:nowrap}
#recList li:nth-child(odd){background:#f2f6ff}
#recList .rk{width:26px;font-weight:900;color:#1e88e5}
#recList .sc{flex:1;text-align:left;font-weight:900;font-size:17px}
#recList .cn{color:#6b7896;font-size:13px}
.newb{display:inline-block;background:#ff1744;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:900;margin-left:6px;vertical-align:middle;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#overScore{font-size:64px;font-weight:900;color:#1e88e5;line-height:1;letter-spacing:-2px}
#overTitle{font-size:24px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(20,30,60,.88);padding:10px 16px;border-radius:14px;font-weight:900;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
/* 가로 화면 (갤럭시탭 등) */
@media (orientation:landscape){
  #menu{flex-direction:row;gap:28px;justify-content:center}
  #menu .title{font-size:clamp(40px,6vw,64px)}
  #menu>.ttl{display:flex;flex-direction:column;align-items:center}
  #menu .panel{margin-top:0!important;width:min(46vw,440px)}
  .cbtn{width:min(22vw,190px);height:min(22vw,150px);max-height:150px}
  #ctrl{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}
}
@media (orientation:landscape) and (max-height:560px){
  #preview{width:110px;height:125px}
  .big{padding:11px 10px;font-size:18px;margin-top:7px}
  .panel{padding:12px}
  #banner{top:22%}
  .cbtn{height:min(28vh,120px)}
}
.rtabs{display:flex;gap:6px;margin-top:8px}
.rtabs button{flex:1;padding:9px 0;border-radius:12px;background:#eef3ff;color:#6b7896;font-weight:900;font-size:14px;letter-spacing:-.4px}
.rtabs button.on{background:#1e88e5;color:#fff}
#regName{width:100%;font-size:22px;font-weight:900;text-align:center;padding:12px;border-radius:14px;border:3px solid #cfd8ea;margin-top:10px;font-family:inherit;color:#24304a}
#regName:focus{outline:none;border-color:#1e88e5}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div id="hudRow">
    <button id="btnPause" aria-label="일시정지">II</button>
    <div id="coinBox"><span class="coin"></span><span id="hudCoin">0</span></div>
  </div>
  <div id="score">0</div>
  <div id="gaugeWrap"><div id="gauge"></div></div>
  <div id="hearts" class="hide" style="text-align:center;font-size:26px;margin-top:4px;letter-spacing:2px;white-space:nowrap">❤️❤️❤️</div>
  <div id="hurry" style="position:fixed;left:0;right:0;top:40%;text-align:center;font-size:clamp(34px,11vw,52px);font-weight:900;color:#ffeb3b;text-shadow:0 4px 0 #d84315;opacity:0;pointer-events:none;white-space:nowrap">빨리빨리!</div>
  <div id="taBox" class="hide" style="text-align:center;margin-top:4px">
    <div id="taTime" style="font-size:clamp(30px,9vw,40px);font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25);letter-spacing:-1px;white-space:nowrap">⏱ 40</div>
    <div id="taNext" style="font-size:14px;font-weight:900;background:rgba(0,0,0,.28);display:inline-block;padding:4px 12px;border-radius:12px;white-space:nowrap">🎁 시간 선물까지 50층</div>
  </div>
</div>
<div id="banner"></div>
<div id="tip" class="hide"></div>

<div id="ctrl" class="hide">
  <button class="cbtn" id="btnTurn"><span class="ic">↖</span>왼쪽</button>
  <button class="cbtn" id="btnUp"><span class="ic">↗</span>오른쪽</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="ttl"><div class="title">무한의 <span>계단</span></div>
  <div class="sub">끝없이 올라가 보자!</div></div>
  <div class="panel" style="margin-top:14px">
    <div class="stat">
      <div class="chip">🏆 최고 <span id="mBest">0</span>계단</div>
      <div class="chip"><span class="coin"></span><span id="mCoin">0</span></div>
    </div>
    <div class="pvRow">
      <button class="arrow" id="pvPrev">◀</button>
      <canvas id="preview" width="300" height="340"></canvas>
      <button class="arrow" id="pvNext">▶</button>
    </div>
    <div id="pvName">눕</div>
    <div style="display:flex;gap:6px;justify-content:center;margin-top:6px"><button id="btnPhoto" class="hide" style="background:#fff0f5;color:#d81b60;border-radius:12px;padding:7px 12px;font-weight:900;font-size:14px;letter-spacing:-.4px">📷 얼굴 사진 넣기</button><button id="btnPhotoDel" class="hide" style="background:#eef3ff;color:#3a4766;border-radius:12px;padding:7px 12px;font-weight:900;font-size:14px;letter-spacing:-.4px">↺ 얼굴 초기화</button></div>
    <div class="seg" id="modeSeg" style="margin-top:10px">
      <button data-m="0">🪜 기본</button><button data-m="1">⏱ 시간 도전</button>
    </div>
    <div class="seg" id="diffSeg" style="margin-top:6px">
      <button data-d="0">쉬움</button><button data-d="1">보통</button><button data-d="2">어려움</button>
    </div>
    <button class="big b-go" id="btnStart">▶ 게임 시작</button>
    <div class="row">
      <button class="big b-org" id="btnShop">🧍 캐릭터</button>
      <button class="big b-blue" id="btnRec">🏆 기록</button>
    </div>
    <div class="tog"><button id="tgSnd">🔊 효과음</button><button id="tgBgm">🎵 음악</button></div>
    <div class="hint">조작: 계단이 있는 쪽 버튼을 눌러요 (← / → 키도 OK)</div>
  </div>
</div>

<!-- SHOP -->
<div id="shop" class="screen hide">
  <div id="shopHead">
    <button class="xbtn" id="shopBack">←</button>
    <h2>캐릭터 <span id="ownCnt" style="font-size:16px;opacity:.9"></span></h2>
    <div class="coinchip"><span class="coin"></span><span id="sCoin">0</span></div>
  </div>
  <button class="big b-pink" id="gachaBtn">🎁 랜덤 뽑기 <span class="coin" style="vertical-align:-3px"></span> 50</button>
  <div id="grid"></div>
</div>

<!-- RECORDS -->
<div id="rec" class="screen hide">
  <div class="panel">
    <div id="overTitle">🏆 기록</div>
    <div class="rtabs" id="recTabs"><button data-t="me">📒 내 기록</button><button data-t="r0">🌍 랭킹 · 기본</button><button data-t="r1">🌍 랭킹 · 시간</button></div>
    <ul id="recList"></ul>
    <button class="big b-gray" id="recBack">돌아가기</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="over" class="screen hide">
  <div class="panel">
    <div id="overTitle2" style="font-size:24px;font-weight:900;letter-spacing:-1px;white-space:nowrap">앗! 떨어졌어요</div>
    <div style="margin-top:8px;font-weight:800;color:#6b7896">이번 기록</div>
    <div id="overScore">0</div>
    <div class="stat" style="margin-top:10px">
      <div class="chip">🏆 최고 <span id="oBest">0</span></div>
      <div class="chip"><span class="coin"></span>+<span id="oCoin">0</span></div>
    </div>
    <div class="row"><button class="big b-pink" id="btnCont">▶ 이어하기</button><button class="big b-go" id="btnRetry">↻ 다시 하기</button></div>
    <button class="big b-blue" id="btnReg">🏅 랭킹에 이름 올리기</button>
    <div class="row">
      <button class="big b-org" id="oShop">🧍 캐릭터</button>
      <button class="big b-gray" id="oMenu">🏠 처음으로</button>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div id="pause" class="screen hide">
  <div class="panel">
    <div style="font-size:26px;font-weight:900">잠깐 쉬는 중</div>
    <button class="big b-go" id="btnResume">▶ 계속하기</button>
    <button class="big b-gray" id="btnQuit">🏠 처음으로</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="screen hide">
  <div class="panel">
    <canvas id="mCanvas" width="300" height="340"></canvas>
    <div id="mText"></div>
    <div class="row" id="mBtns"></div>
  </div>
</div>
<div id="crop" class="screen hide" style="z-index:25">
  <div class="panel">
    <div style="font-weight:900;font-size:18px;letter-spacing:-.5px;white-space:nowrap">얼굴을 네모 칸에 맞춰 주세요</div>
    <div style="font-size:12.5px;color:#7a86a3;font-weight:700;margin:4px 0 8px;white-space:nowrap">손가락으로 끌어서 옮기고, 아래 막대로 크기 조절</div>
    <canvas id="cropCv" width="560" height="560" style="width:260px;height:260px;display:block;margin:0 auto;border-radius:18px;background:#222;touch-action:none"></canvas>
    <input id="cropZoom" type="range" min="1" max="5" step="0.01" value="1.5" style="width:100%;margin-top:12px;accent-color:#d81b60">
    <div class="row"><button class="big b-gray" id="cropCancel">취소</button><button class="big b-go" id="cropSave">저장</button></div>
    <button class="big b-gray" id="cropDel" style="font-size:16px;padding:10px">🗑 사진 지우고 그림 얼굴로</button>
  </div>
</div>
<input id="photoIn" type="file" accept="image/*" class="hide">
<div id="reg" class="screen hide" style="z-index:26">
  <div class="panel">
    <div style="font-size:22px;font-weight:900;letter-spacing:-.5px;white-space:nowrap">🏅 랭킹 등록</div>
    <div id="regInfo" style="font-weight:800;color:#6b7896;margin-top:4px;white-space:nowrap">120계단 · 기본</div>
    <input id="regName" maxlength="10" placeholder="이름을 써 주세요" autocomplete="off">
    <div class="row"><button class="big b-gray" id="regCancel">취소</button><button class="big b-go" id="regOk">등록하기</button></div>
  </div>
</div>
<div id="exitAsk" class="screen hide" style="z-index:40">
  <div class="panel">
    <div style="font-size:24px;font-weight:900;letter-spacing:-.5px;white-space:nowrap">게임을 종료하시겠습니까?</div>
    <div class="row" style="margin-top:6px"><button class="big b-go" id="exitNo">계속하기</button><button class="big b-gray" id="exitYes">종료</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 기본 ================= */
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,S=60,SH=30;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  S=W>H ? Math.max(40,Math.min(W/8,H/8.5,112)) : Math.max(46,Math.min(W/6.2,H/10.5,88)); SH=S*0.5;
}
addEventListener('resize',resize); resize();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ================= 저장 ================= */
const SKEY='infinite_stairs_v1';

const FKEY='infinite_stairs_faces';
let faceData={}; try{faceData=JSON.parse(localStorage.getItem(FKEY))||{};}catch(e){}
const faceImgs={};
function loadFace(id){ if(!faceData[id]){ delete faceImgs[id]; return; } const im=new Image(); im.onload=()=>{faceImgs[id]=im; if(!$('shop').classList.contains('hide')) buildShop(); if(typeof refreshMenu==='function'&&state==='menu') refreshMenu();}; im.src=faceData[id]; }
Object.keys(faceData).forEach(loadFace);
function saveFaces(){ try{localStorage.setItem(FKEY,JSON.stringify(faceData)); return true;}catch(e){ return false; } }
function photoHead(G,id,cx,cy,w,r){
  const im=faceImgs[id]; if(!im) return false;
  G.save(); G.translate(cx,cy); if(curFace<0) G.scale(-1,1);
  rr(G,-w/2,-w/2,w,w,r); G.save(); G.clip(); G.drawImage(im,-w/2,-w/2,w,w); G.restore();
  G.lineWidth=w*0.04; G.strokeStyle='rgba(0,0,0,.25)'; G.stroke(); G.restore(); return true;
}

/* ================= 그리기 도구 ================= */
function rr(G,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));G.beginPath();G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath();}
function box(G,col,x,y,w,h,r){G.fillStyle=col;rr(G,x,y,w,h,r||0);G.fill();}
function circ(G,col,x,y,r){G.fillStyle=col;G.beginPath();G.arc(x,y,r,0,Math.PI*2);G.fill();}
function ell(G,col,x,y,rx,ry,rot){G.fillStyle=col;G.beginPath();G.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);G.fill();}
function poly(G,col,pts){G.fillStyle=col;G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fill();}
const shadeCache={};
function shade(hex,amt){
  const k=hex+amt; if(shadeCache[k]) return shadeCache[k];
  let r,gg,b;
  if(hex[0]==='r'){ const m=hex.match(/\d+/g); r=+m[0]; gg=+m[1]; b=+m[2]; }
  else { let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(ch=>ch+ch).join(''); const n=parseInt(c,16); r=n>>16; gg=n>>8&255; b=n&255; }
  if(amt<0){r*=1+amt;gg*=1+amt;b*=1+amt;} else {r+=(255-r)*amt;gg+=(255-gg)*amt;b+=(255-b)*amt;}
  return shadeCache[k]=`rgb(${r|0},${gg|0},${b|0})`;
}
function star(G,col,x,y,r){G.fillStyle=col;G.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*0.45:r;G.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}G.closePath();G.fill();}
function heart(G,col,x,y,r){G.fillStyle=col;G.beginPath();G.moveTo(x,y+r*0.9);G.bezierCurveTo(x-r*1.6,y-r*0.2,x-r*0.6,y-r*1.3,x,y-r*0.4);G.bezierCurveTo(x+r*0.6,y-r*1.3,x+r*1.6,y-r*0.2,x,y+r*0.9);G.fill();}

function drawChar(G,c,x,y,s,face,walk,t){

let AC=null;

function tone(f,d,type,v,slide,delay){ if(!save.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+(delay||0);
  const o=a.createOscillator(), gn=a.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  gn.gain.setValueAtTime(v||0.06,t); gn.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t+d+0.03); }
const SFX={
  step(){tone(480+(score%8)*35,0.06,'square',0.045);},
  coin(){tone(988,0.07,'square',0.05);tone(1319,0.16,'square',0.05,0,0.07);},
  fall(){tone(520,0.7,'sawtooth',0.07,0.15);},
  mile(){[523,659,784,1047].forEach((f,i)=>tone(f,0.14,'square',0.05,0,i*0.09));},
  click(){tone(660,0.05,'triangle',0.08);},
  buy(){[784,988,1175,1568].forEach((f,i)=>tone(f,0.12,'triangle',0.09,0,i*0.07));},

};

let bgmNext=0,bgmStep=0;
function note(m,dur,type,vol,at){ if(!m) return; const a=AC; const f=440*Math.pow(2,(m-69)/12); const o=a.createOscillator(),gn=a.createGain(); o.type=type; o.frequency.value=f; gn.gain.setValueAtTime(vol,at); gn.gain.exponentialRampToValueAtTime(0.0001,at+dur); o.connect(gn); gn.connect(a.destination); o.start(at); o.stop(at+dur+0.02); }
setInterval(()=>{
  if(!save.music||!AC||AC.state!=='running'||document.hidden) return;

  while(bgmNext<AC.currentTime+0.25){ const k=bgmStep%32; note(MEL[k],spb*0.9,'square',0.02,bgmNext); note(BAS[k],spb*0.95,'triangle',0.05,bgmNext); bgmNext+=spb; bgmStep++; }
},80);

let state='menu', xs=[], coinAt=[], runLeft=0, genDir=1;
let score=0, gauge=1, started=false, gotCoins=0, shake=0, now=0, failType='';

const TA={start:[50,40,32], step:50, bonus:(k,d)=>Math.max(d===0?14:d===1?10:8, [34,30,25][d]-2*(k-1)), penalty:[2,3,4], stun:0.35};

function drawHearts(){ const h=$('hearts'); h.classList.toggle('hide',!useHearts()||state==='menu'); h.textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives)); }
const isTA=()=>save.mode===1;
const HOP=0.085;
function wx(i){return xs[i]*S;} function wy(i){return -i*SH;}
function genUntil(n){
  while(xs.length<=n){
    const i=xs.length;
    if(runLeft<=0){ genDir=-genDir; const mx=i<60?5:i<250?4:3; runLeft=1+Math.floor(Math.random()*mx); }
    xs.push(xs[i-1]+genDir); runLeft--;
    coinAt.push(i>4 && Math.random()<0.14);
  }
}
function resetGame(){
  xs=[0]; coinAt=[false]; genDir=Math.random()<0.5?1:-1; runLeft=2+Math.floor(Math.random()*3);
  genUntil(80);
  P.i=0; P.face=xs[1]-xs[0]; P.from={x:0,y:0}; P.to={x:0,y:0}; P.t0=-1; P.fall=null;
  score=0; gauge=1; started=false; gotCoins=0; particles=[]; pops=[]; conts=0; lastRec=null;
  taTime=TA.start[save.diff]; taNext=TA.step; taK=0; stunT=0; lives=3; hurried=false; lastTick=99;
  cam.x=0; cam.y=0;
}
function visualPos(){
  if(P.t0<0) return {x:P.to.x,y:P.to.y,p:1};
  const p=clamp((now-P.t0)/HOP,0,1), e=1-(1-p)*(1-p);
  return {x:P.from.x+(P.to.x-P.from.x)*e, y:P.from.y+(P.to.y-P.from.y)*e - Math.sin(Math.PI*p)*S*0.22, p};
}
function act(dir){
  if(state!=='play') return;
  if(stunT>0) return;
  P.face=dir;
  const ni=P.i+1; genUntil(ni+60);
  const tx=xs[P.i]+P.face, cur=visualPos();
  started=true;
  if(xs[ni]===tx){
    P.from={x:cur.x,y:cur.y+ (cur.p<1? Math.sin(Math.PI*cur.p)*S*0.22:0)}; P.i=ni; P.to={x:wx(ni),y:wy(ni)}; P.t0=now; P.walk=-P.walk;
    score++; gauge=Math.min(1,gauge+0.1);
    if(isTA() && score>=taNext){ taK++; const b=TA.bonus(taK,save.diff); taTime+=b; taNext+=TA.step; SFX.mile(); showBanner(`🎁 +${b}초!`, `${score}층 시간 선물`); }
    SFX.step();
    dust(P.to.x,P.to.y);
    trail(CMAP[save.sel].trail,P.to.x,P.to.y);
    if(coinAt[ni]){coinAt[ni]=false; gotCoins++; SFX.coin(); coinBurst(P.to.x,P.to.y-S*0.9); pops.push({x:P.to.x,y:P.to.y-S*1.4,t:0,txt:'+1'});}

    updHud();
  } else if(isTA()){
    P.face=-P.face; const pen=TA.penalty[save.diff]; taTime-=pen; stunT=TA.stun; shake=6; started=true;
    tone(180,0.25,'square',0.06,0.6); try{navigator.vibrate&&navigator.vibrate(40);}catch(e){}
    pops.push({x:cur.x,y:cur.y-S*1.6,t:0,txt:`-${pen}초`}); updHud();
  } else if(useHearts() && lives>1){
    lives--; drawHearts(); P.face=-P.face; stunT=TA.stun; shake=6; started=true;
    tone(220,0.3,'triangle',0.08,0.5); try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    pops.push({x:cur.x,y:cur.y-S*1.6,t:0,txt:'💔'}); showBanner(lives===1?'마지막 하트!':'괜찮아!', lives===1?'조심조심~':'하트가 '+lives+'개 남았어요');
  } else {

      case 'diamond': p.col=k%2?'#84ffff':'#e0f7fa'; p.type='diamond'; break;
      case 'star': p.col='#fff176'; p.type='star'; break;

async function flushPending(){
  if(!save.pending||!save.pending.length||!navigator.onLine) return;
  const left=[]; for(const row of save.pending){ try{ await sbPost(row); }catch(e){ left.push(row); } }
  if(left.length<save.pending.length) toast('기다리던 랭킹 기록을 올렸어요!');
  save.pending=left; persist();
}
addEventListener('online',flushPending); setTimeout(flushPending,2000);
$('btnReg').onclick=()=>{
  if(!lastGame||lastGame.score<1){ toast('1계단 이상 올라야 등록할 수 있어요'); return; }
  if(regDone){ toast('이번 기록은 이미 등록했어요'); return; }
  SFX.click(); $('regInfo').textContent=`${lastGame.score}계단 · ${lastGame.mode?'시간 도전':'기본'} · ${DIFF[lastGame.diff].name}`;
  $('regName').value=save.lastName||''; $('reg').classList.remove('hide'); setTimeout(()=>$('regName').focus(),100);
};
$('regCancel').onclick=()=>{ SFX.click(); $('reg').classList.add('hide'); };
$('regOk').onclick=async()=>{
  const name=$('regName').value.trim().slice(0,10);
  if(!name){ toast('이름을 써 주세요'); return; }
  save.lastName=name; persist();
  const row={name,score:lastGame.score,mode:lastGame.mode,diff:lastGame.diff,char_id:lastGame.char};
  $('reg').classList.add('hide'); regDone=true; $('btnReg').style.opacity=0.5;
  try{ await sbPost(row); SFX.buy(); let rk=''; try{ rk=await sbRank(row.mode,row.score); }catch(e){}
    toast(rk?`🏅 등록 완료! 전체 ${rk}등이에요`:'🏅 랭킹에 등록했어요!'); }
  catch(e){ save.pending=save.pending||[]; save.pending.push(row); persist(); toast('인터넷이 연결되면 자동으로 등록돼요'); }
};
$('regName').addEventListener('keydown',e=>{ if(e.key==='Enter') $('regOk').click(); e.stopPropagation(); });

let recTab='me';
async function renderRec(){
  [...$('recTabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===recTab));
  const ul=$('recList'); ul.innerHTML='';
  if(recTab==='me'){
    if(!save.records.length) ul.innerHTML='<li style="justify-content:center;color:#7a86a3">아직 기록이 없어요. 도전해 보세요!</li>';
    save.records.forEach((r,i)=>{ const li=document.createElement('li'); const nm=(CMAP[r.c]||CHARS[0]).name;
      li.innerHTML=`<span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="sc">${r.s}계단</span><span class="cn">${nm} · ${r.ta?'⏱':'🪜'} ${DIFF[r.m||0].name} · ${r.d}</span>`; ul.appendChild(li); });
    return;
  }
  ul.innerHTML='<li style="justify-content:center;color:#7a86a3">불러오는 중...</li>';
  try{
    const rows=await sbTop(recTab==='r1'?1:0); ul.innerHTML='';
    if(!rows.length) ul.innerHTML='<li style="justify-content:center;color:#7a86a3">아직 아무도 없어요. 1등을 차지해 보세요!</li>';
    rows.forEach((r,i)=>{ const li=document.createElement('li'); const nm=(CMAP[r.char_id]||CHARS[0]).name; const d=new Date(r.created_at);
      const esc=String(r.name).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      li.innerHTML=`<span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="sc">${esc} <small style="color:#1e88e5">${r.score}계단</small></span><span class="cn">${nm} · ${DIFF[r.diff].name} · ${d.getMonth()+1}/${d.getDate()}</span>`; ul.appendChild(li); });
  }catch(e){ ul.innerHTML='<li style="justify-content:center;color:#7a86a3;white-space:normal;text-align:center">인터넷이 연결되어 있을 때 볼 수 있어요 📶</li>'; }
}
$('recTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; SFX.click(); recTab=b.dataset.t; renderRec(); });

// ===== 뒤로가기 → 종료 확인 =====
let exitArmed=false, pausedByBack=false;
function armBack(){ try{ history.pushState({stairs:1},''); exitArmed=true; }catch(e){} }
addEventListener('popstate',()=>{
  if(!exitArmed) return;
  if(state==='play'){ pauseGame(); pausedByBack=true; }
  $('exitAsk').classList.remove('hide');
});
$('exitNo').onclick=()=>{ SFX.click(); $('exitAsk').classList.add('hide'); armBack(); };
$('exitYes').onclick=()=>{ $('exitAsk').classList.add('hide'); exitArmed=false; persist(); try{ window.close(); }catch(e){} history.back(); };
addEventListener('pointerdown',function once(){ armBack(); removeEventListener('pointerdown',once); },{once:true});

// 시작
resetGame(); refreshMenu(); show('menu'); requestAnimationFrame(frame);

// 오프라인 지원 (웹에 올렸을 때 한 번 접속하면 이후 비행기 모드에서도 실행)
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
