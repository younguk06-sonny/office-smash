<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d8bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>무한의 계단</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#7fd3ff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block}
.cbtn.hintb{animation:hintb .6s infinite alternate}
@keyframes hintb{from{filter:brightness(1);transform:scale(1)}to{filter:brightness(1.35);transform:scale(1.06)}}
#tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 160px);text-align:center;font-weight:900;font-size:clamp(16px,4.6vw,20px);text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;white-space:nowrap;letter-spacing:-.5px}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;white-space:nowrap}
.hide{display:none!important}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none}
#hudRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#btnPause{pointer-events:auto;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.28);font-size:20px;font-weight:900}
#coinBox{background:rgba(0,0,0,.28);padding:7px 12px;border-radius:14px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff59d,#ffca28 45%,#f9a825);box-shadow:inset 0 0 0 2px #f57f17;flex:none}
#score{font-size:clamp(44px,13vw,72px);font-weight:900;text-align:center;line-height:1;margin-top:2px;text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 12px rgba(0,0,0,.15);letter-spacing:-1px}
#gaugeWrap{margin:8px auto 0;width:min(78vw,360px);height:18px;border-radius:10px;background:rgba(0,0,0,.35);padding:3px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
#gauge{height:100%;border-radius:7px;background:linear-gradient(90deg,#ff5252,#ffca28 35%,#69f0ae);width:100%;transform-origin:left}
#banner{position:fixed;left:0;right:0;top:32%;text-align:center;font-weight:900;font-size:clamp(26px,8vw,44px);text-shadow:0 3px 0 rgba(0,0,0,.3);pointer-events:none;opacity:0;letter-spacing:-1px;white-space:nowrap}
#banner small{display:block;font-size:.5em;margin-top:6px;opacity:.95}
#banner.show{animation:ban 1.6s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
/* controls */
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:0 14px calc(env(safe-area-inset-bottom) + 18px);pointer-events:none}
.cbtn{pointer-events:auto;width:min(40vw,170px);height:min(40vw,170px);max-height:120px;border-radius:28px;font-weight:900;font-size:clamp(17px,5vw,22px);letter-spacing:-1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 7px 0 rgba(0,0,0,.28);transition:transform .05s}
.cbtn .ic{font-size:clamp(28px,9vw,40px);line-height:1}
.cbtn:active,.cbtn.down{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
#btnTurn{background:linear-gradient(#ff8a65,#f4511e)}
#btnUp{background:linear-gradient(#4fc3f7,#1e88e5)}
/* screens */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 14px);background:rgba(10,20,60,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{background:rgba(255,255,255,.96);color:#24304a;border-radius:26px;padding:18px;width:min(92vw,420px);box-shadow:0 10px 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.25);text-align:center}
.title{font-size:clamp(40px,12.5vw,60px);font-weight:900;letter-spacing:-3px;line-height:1.05;color:#fff;text-shadow:0 4px 0 #1e5bb8,0 8px 0 rgba(0,0,0,.2);white-space:nowrap}
.title span{color:#ffd54f}
.sub{color:#fff;font-weight:800;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.25);font-size:15px;white-space:nowrap}
.big{width:100%;padding:16px 10px;border-radius:18px;font-size:clamp(20px,6vw,24px);font-weight:900;letter-spacing:-1px;box-shadow:0 6px 0 rgba(0,0,0,.2);margin-top:10px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.b-go{background:linear-gradient(#66bb6a,#2e7d32);color:#fff}
.b-blue{background:linear-gradient(#64b5f6,#1e88e5);color:#fff}
.b-org{background:linear-gradient(#ffb74d,#f57c00);color:#fff}
.b-gray{background:#e3e8f2;color:#3a4766}
.b-pink{background:linear-gradient(#f48fb1,#d81b60);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stat{display:flex;justify-content:center;gap:10px;margin:6px 0 2px;flex-wrap:nowrap}
.chip{background:#eef3ff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap;color:#2b3a5e}
#preview{display:block;margin:2px auto 0;width:150px;height:170px}
.pvRow{display:flex;align-items:center;justify-content:center;gap:6px}
.arrow{width:44px;height:44px;border-radius:50%;background:#eef3ff;color:#3a4766;font-size:20px;font-weight:900}
#pvName{font-weight:900;font-size:19px;margin-top:-4px;letter-spacing:-.5px;white-space:nowrap}
.seg{display:flex;background:#eef3ff;border-radius:14px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-weight:900;font-size:15px;color:#6b7896;background:none;letter-spacing:-.5px}
.seg button.on{background:#fff;color:#1e88e5;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.tog{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tog button{background:#eef3ff;color:#3a4766;border-radius:12px;padding:8px 12px;font-weight:900;font-size:14px}
.tog button.off{opacity:.45}
.hint{font-size:12.5px;color:#7a86a3;margin-top:10px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
/* shop */
#shop{justify-content:flex-start}
#shopHead{width:min(96vw,560px);display:flex;align-items:center;gap:8px;margin-bottom:8px}
#shopHead h2{flex:1;font-size:24px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:-1px;white-space:nowrap}
#shopHead .coinchip{background:rgba(0,0,0,.3);padding:7px 11px;border-radius:12px;font-weight:900;display:flex;gap:5px;align-items:center;white-space:nowrap}
.xbtn{width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.3);font-size:20px;font-weight:900}
#gachaBtn{width:min(96vw,560px);margin:0 0 10px;padding:12px;font-size:19px}
#grid{width:min(96vw,560px);flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;padding-bottom:20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card{background:rgba(255,255,255,.95);border-radius:16px;padding:6px 4px 7px;color:#24304a;text-align:center;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.card canvas{width:84px;height:94px;display:block;margin:0 auto}
.card .nm{font-weight:900;font-size:13px;letter-spacing:-.6px;white-space:nowrap;overflow:hidden}
.card .st{font-size:11.5px;font-weight:900;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;letter-spacing:-.4px}
.card .st .coin{width:13px;height:13px}
.card.sel{outline:4px solid #ffca28}
.card.lock canvas{filter:brightness(.15) saturate(0);opacity:.7}
.card.lock{background:rgba(235,240,250,.92)}
.st.own{color:#2e7d32}.st.sel{color:#f57c00}.st.price{color:#3a4766}.st.need{color:#8e24aa}
/* modal */
#modal{z-index:20}
#modal .panel{width:min(86vw,340px)}
#mText{font-weight:900;font-size:19px;margin:6px 0 4px;letter-spacing:-.5px}
#mCanvas{width:150px;height:170px;display:block;margin:0 auto}
/* records */
#recList{list-style:none;margin-top:8px;max-height:52vh;overflow-y:auto}
#recList li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;font-weight:800;font-size:15px;white-space:nowrap}
#recList li:nth-child(odd){background:#f2f6ff}
#recList .rk{width:26px;font-weight:900;color:#1e88e5}
#recList .sc{flex:1;text-align:left;font-weight:900;font-size:17px}
#recList .cn{color:#6b7896;font-size:13px}
.newb{display:inline-block;background:#ff1744;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:900;margin-left:6px;vertical-align:middle;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
#overScore{font-size:64px;font-weight:900;color:#1e88e5;line-height:1;letter-spacing:-2px}
#overTitle{font-size:24px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(20,30,60,.88);padding:10px 16px;border-radius:14px;font-weight:900;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div id="hudRow">
    <button id="btnPause" aria-label="일시정지">II</button>
    <div id="coinBox"><span class="coin"></span><span id="hudCoin">0</span></div>
  </div>
  <div id="score">0</div>
  <div id="gaugeWrap"><div id="gauge"></div></div>
</div>
<div id="banner"></div>
<div id="tip" class="hide"></div>

<div id="ctrl" class="hide">
  <button class="cbtn" id="btnTurn"><span class="ic">↩</span>방향전환</button>
  <button class="cbtn" id="btnUp"><span class="ic">⬆</span>오르기</button>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <div class="title">무한의 <span>계단</span></div>
  <div class="sub">끝없이 올라가 보자!</div>
  <div class="panel" style="margin-top:14px">
    <div class="stat">
      <div class="chip">🏆 최고 <span id="mBest">0</span>계단</div>
      <div class="chip"><span class="coin"></span><span id="mCoin">0</span></div>
    </div>
    <div class="pvRow">
      <button class="arrow" id="pvPrev">◀</button>
      <canvas id="preview" width="300" height="340"></canvas>
      <button class="arrow" id="pvNext">▶</button>
    </div>
    <div id="pvName">눕</div>
    <div class="seg" id="diffSeg">
      <button data-d="0">쉬움</button><button data-d="1">보통</button><button data-d="2">어려움</button>
    </div>
    <button class="big b-go" id="btnStart">▶ 게임 시작</button>
    <div class="row">
      <button class="big b-org" id="btnShop">🧍 캐릭터</button>
      <button class="big b-blue" id="btnRec">🏆 기록</button>
    </div>
    <div class="tog"><button id="tgSnd">🔊 효과음</button><button id="tgBgm">🎵 음악</button></div>
    <div class="hint">조작: ← 방향전환 · → 오르기 (키보드 Z / X 도 OK)</div>
  </div>
</div>

<!-- SHOP -->
<div id="shop" class="screen hide">
  <div id="shopHead">
    <button class="xbtn" id="shopBack">←</button>
    <h2>캐릭터 <span id="ownCnt" style="font-size:16px;opacity:.9"></span></h2>
    <div class="coinchip"><span class="coin"></span><span id="sCoin">0</span></div>
  </div>
  <button class="big b-pink" id="gachaBtn">🎁 랜덤 뽑기 <span class="coin" style="vertical-align:-3px"></span> 50</button>
  <div id="grid"></div>
</div>

<!-- RECORDS -->
<div id="rec" class="screen hide">
  <div class="panel">
    <div id="overTitle">🏆 나의 기록</div>
    <ul id="recList"></ul>
    <button class="big b-gray" id="recBack">돌아가기</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="over" class="screen hide">
  <div class="panel">
    <div id="overTitle2" style="font-size:24px;font-weight:900;letter-spacing:-1px;white-space:nowrap">앗! 떨어졌어요</div>
    <div style="margin-top:8px;font-weight:800;color:#6b7896">이번 기록</div>
    <div id="overScore">0</div>
    <div class="stat" style="margin-top:10px">
      <div class="chip">🏆 최고 <span id="oBest">0</span></div>
      <div class="chip"><span class="coin"></span>+<span id="oCoin">0</span></div>
    </div>
    <button class="big b-go" id="btnRetry">↻ 다시 하기</button>
    <div class="row">
      <button class="big b-org" id="oShop">🧍 캐릭터</button>
      <button class="big b-gray" id="oMenu">🏠 처음으로</button>
    </div>
  </div>
</div>

<!-- PAUSE -->
<div id="pause" class="screen hide">
  <div class="panel">
    <div style="font-size:26px;font-weight:900">잠깐 쉬는 중</div>
    <button class="big b-go" id="btnResume">▶ 계속하기</button>
    <button class="big b-gray" id="btnQuit">🏠 처음으로</button>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="screen hide">
  <div class="panel">
    <canvas id="mCanvas" width="300" height="340"></canvas>
    <div id="mText"></div>
    <div class="row" id="mBtns"></div>
  </div>
</div>
<div id="toast"></div>

function rr(G,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));G.beginPath();G.moveTo(x+r,y);G.arcTo(x+w,y,x+w,y+h,r);G.arcTo(x+w,y+h,x,y+h,r);G.arcTo(x,y+h,x,y,r);G.arcTo(x,y,x+w,y,r);G.closePath();}
function box(G,col,x,y,w,h,r){G.fillStyle=col;rr(G,x,y,w,h,r||0);G.fill();}
function circ(G,col,x,y,r){G.fillStyle=col;G.beginPath();G.arc(x,y,r,0,Math.PI*2);G.fill();}
function ell(G,col,x,y,rx,ry,rot){G.fillStyle=col;G.beginPath();G.ellipse(x,y,rx,ry,rot||0,0,Math.PI*2);G.fill();}
function poly(G,col,pts){G.fillStyle=col;G.beginPath();G.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)G.lineTo(pts[i],pts[i+1]);G.closePath();G.fill();}
const shadeCache={};
function shade(hex,amt){
  const k=hex+amt; if(shadeCache[k]) return shadeCache[k];
  let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(ch=>ch+ch).join('');
  const n=parseInt(c,16); let r=n>>16,gg=n>>8&255,b=n&255;
  if(amt<0){r*=1+amt;gg*=1+amt;b*=1+amt;} else {r+=(255-r)*amt;gg+=(255-gg)*amt;b+=(255-b)*amt;}
  return shadeCache[k]=`rgb(${r|0},${gg|0},${b|0})`;
}
function star(G,col,x,y,r){G.fillStyle=col;G.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*0.45:r;G.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}G.closePath();G.fill();}

  drawHat(G,c,u,t,'front');

}

    if(p.type==='star') star(g,p.col,X,Y,p.r*1.3);
    else if(p.type==='heart') heart(g,p.col,X,Y,p.r);
    else if(p.type==='diamond') poly(g,p.col,[X,Y-p.r*1.3,X+p.r,Y,X,Y+p.r*1.3,X-p.r,Y]);
    else if(p.type==='ring'){g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.arc(X,Y,p.r,0,7);g.stroke();}
    else if(p.type==='line'){g.strokeStyle=p.col;g.lineWidth=3;g.beginPath();g.moveTo(X,Y);g.lineTo(X-P.face*S*0.5,Y);g.stroke();}
    else circ(g,p.col,X,Y,p.r*(0.5+a*0.5));
  }
  g.globalAlpha=1;
  for(let k=pops.length-1;k>=0;k--){ const p=pops[k]; p.t+=dt; if(p.t>0.8){pops.splice(k,1);continue;}
    g.globalAlpha=1-p.t/0.8; g.font=`900 ${Math.round(S*0.4)}px sans-serif`; g.textAlign='center'; g.fillStyle='#fff8c4'; g.strokeStyle='rgba(0,0,0,.4)'; g.lineWidth=4;
    g.strokeText(p.txt,sx(p.x),sy(p.y)-p.t*S); g.fillText(p.txt,sx(p.x),sy(p.y)-p.t*S); }
  g.globalAlpha=1;
}

/* ================= 메인 루프 ================= */
let last=performance.now()/1000, hudScore=-1, hudCoin=-1;
function frame(){
  const tnow=performance.now()/1000; let dt=Math.min(0.05,tnow-last); last=tnow;
  if(state==='pause') dt=0;
  now+=dt;
  // 업데이트
  if(state==='play'&&started){
    const drain=Math.min(1.15,0.22*(1+score/230))*DIFF[save.diff].m;
    gauge-=drain*dt; if(gauge<=0){gauge=0; const v=visualPos(); fail('time',{x:v.x,y:v.y});}
  }
  if(P.fall){ const f=P.fall; f.vy+=S*28*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.vr*dt; f.t+=dt; if(state==='falling'&&f.t>1.15) gameOver(); }
  if(state==='menu'){ // 데모: 자동으로 오르기
    demoT+=dt; if(demoT>0.32){demoT=0; demoStep();}
  }
  if(!P.fall){ const v=visualPos(); const k=Math.min(1,dt*10); cam.x+=(v.x-cam.x)*k; cam.y+=(v.y-cam.y)*k; }
  // 그리기
  g.setTransform(DPR,0,0,DPR,0,0);
  const h=Math.max(score,P.i);
  drawBg(h);
  g.save();
  if(shake>0){ g.translate(rand(-shake,shake),rand(-shake,shake)); shake=Math.max(0,shake-dt*30); }
  drawGround();
  const i0=Math.max(0,P.i-16), i1=P.i+30;
  for(let i=i1;i>=i0;i--) if(i<xs.length) drawBlock(i);
  const c=CMAP[save.sel], cs=S*1.3;
  if(P.fall){ g.save(); g.translate(sx(P.fall.x),sy(P.fall.y)-cs*0.5); g.rotate(P.fall.rot); drawChar(g,c,0,cs*0.5,cs,P.face,0.8,now); g.restore(); }
  else { const v=visualPos(); const wk=v.p<1?Math.sin(Math.PI*v.p)*P.walk:Math.sin(now*3)*0.05; drawChar(g,c,sx(v.x),sy(v.y),cs,P.face,wk,now); }
  drawGuideArrow();
  drawParticles(dt);
  g.restore();
  // HUD
  if(state==='play'||state==='falling'){ $('gauge').style.transform=`scaleX(${gauge})`; $('gauge').style.filter=gauge<0.3?`brightness(${1+0.4*Math.sin(now*20)})`:''; }
  if(state==='menu') drawPreview();
  updateGuide();
  requestAnimationFrame(frame);
}
let demoT=0;
function demoStep(){
  genUntil(P.i+60);
  if(xs[P.i+1]!==xs[P.i]+P.face) P.face=-P.face;
  const cur=visualPos(); P.from={x:cur.x,y:cur.y}; P.i++; P.to={x:wx(P.i),y:wy(P.i)}; P.t0=now; P.walk=-P.walk;
  if(coinAt[P.i]) coinAt[P.i]=false;
  if(P.i>250) resetGame();
}

/* ================= 초보 안내 ================= */
let guideKey='';
function updateGuide(){
  let key='';
  if(state==='play' && score<10){ key=(xs[P.i+1]===xs[P.i]+P.face)?'up':'turn'; }
  if(key===guideKey) return; guideKey=key;
  $('btnUp').classList.toggle('hintb',key==='up'); $('btnTurn').classList.toggle('hintb',key==='turn');
  const tip=$('tip');
  if(!key){tip.classList.add('hide');return;}
  tip.classList.remove('hide');
  tip.textContent=key==='up'?'👉 같은 방향이면 오르기!':'👈 방향이 바뀌면 방향전환!';
}
function drawGuideArrow(){
  if(state!=='play'||score>=10) return;
  const i=P.i+1; if(i>=xs.length) return;
  const x=sx(wx(i)), y=sy(wy(i))-S*0.35+Math.sin(now*8)*S*0.08;
  poly(g,'#ffeb3b',[x-S*0.22,y-S*0.3,x+S*0.22,y-S*0.3,x,y]); 
  g.strokeStyle='rgba(0,0,0,.35)'; g.lineWidth=2; g.stroke();
}

/* ================= UI ================= */
const screens=['menu','shop','rec','over','pause'];
function show(id){ screens.forEach(s=>$(s).classList.toggle('hide',s!==id)); }
function updHud(){ if(hudScore!==score){$('score').textContent=score;hudScore=score;} if(hudCoin!==gotCoins){$('hudCoin').textContent=gotCoins;hudCoin=gotCoins;} }
function showBanner(t,sub){ const b=$('banner'); b.innerHTML=t+(sub?`<small>✨ ${sub} ✨</small>`:''); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
let toastT=0; function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1800);}

function startGame(){
  ac(); SFX.click();
  resetGame(); state='play'; show(null);
  $('hud').classList.remove('hide'); $('ctrl').classList.remove('hide');
  hudScore=-1; hudCoin=-1; updHud(); $('gauge').style.transform='scaleX(1)';
  showBanner('출발!', DIFF[save.diff].name+' 모드');
}
function gameOver(){
  state='over';
  $('hud').classList.add('hide');
  const isNew=score>save.best && score>0;
  if(isNew) save.best=score;
  save.coins+=gotCoins; save.games++;
  if(score>0){ const d=new Date(); save.records.push({s:score,c:save.sel,d:`${d.getMonth()+1}/${d.getDate()}`,m:save.diff}); save.records.sort((a,b)=>b.s-a.s); save.records=save.records.slice(0,10); }
  // 기록으로 열리는 캐릭터
  const unlocked=[];
  CHARS.forEach(c=>{ if(c.best && save.best>=c.best && !save.owned.includes(c.id)){ save.owned.push(c.id); unlocked.push(c); } });
  persist();
  $('overTitle2').textContent=failType==='time'?'⏰ 시간 초과!':'앗! 떨어졌어요';
  $('overScore').innerHTML=score+(isNew?'<span class="newb">NEW</span>':'');
  $('oBest').textContent=save.best; $('oCoin').textContent=gotCoins;
  show('over');
  if(unlocked.length){ setTimeout(()=>openModal(unlocked[0],`🎉 새 캐릭터! ${unlocked[0].name}`,[{t:'좋아요!',cls:'b-go',fn:closeModal}]),400); SFX.buy(); }
}
function toMenu(){
  state='menu'; $('hud').classList.add('hide'); $('ctrl').classList.add('hide');
  resetGame(); refreshMenu(); show('menu');
}
function refreshMenu(){
  $('mBest').textContent=save.best; $('mCoin').textContent=save.coins;
  $('pvName').textContent=CMAP[save.sel].name;
  [...$('diffSeg').children].forEach(b=>b.classList.toggle('on',+b.dataset.d===save.diff));
  $('tgSnd').classList.toggle('off',!save.sound); $('tgBgm').classList.toggle('off',!save.music);
}
const pv=$('preview'), pg=pv.getContext('2d');
function drawPreview(){
  pg.setTransform(1,0,0,1,0,0); pg.clearRect(0,0,300,340);
  pg.fillStyle='rgba(30,136,229,.12)'; pg.beginPath(); pg.ellipse(150,312,80,16,0,0,7); pg.fill();
  drawChar(pg,CMAP[save.sel],150,310-Math.abs(Math.sin(now*3))*8,250,Math.sin(now*0.8)>-0.3?1:-1,Math.sin(now*6)*0.25,now);
}
function cyclePv(d){ const own=CHARS.filter(c=>save.owned.includes(c.id)); let k=own.findIndex(c=>c.id===save.sel); k=(k+d+own.length)%own.length; save.sel=own[k].id; persist(); SFX.click(); refreshMenu(); }

// 상점
function charStatus(c){
  if(save.sel===c.id) return {cls:'sel',html:'✔ 사용 중'};
  if(save.owned.includes(c.id)) return {cls:'own',html:'보유'};
  if(c.best) return {cls:'need',html:`🏆 ${c.best}계단`};
  return {cls:'price',html:`<span class="coin"></span>${c.price}`};
}
function thumb(cnv,c,lock){ const G=cnv.getContext('2d'); G.clearRect(0,0,cnv.width,cnv.height); drawChar(G,c,cnv.width/2,cnv.height*0.95,cnv.height*0.82,1,0,1.2); }
let cards=[];
function buildShop(){
  const grid=$('grid'); grid.innerHTML=''; cards=[];
  CHARS.forEach(c=>{
    const d=document.createElement('div'); d.className='card';
    const cn=document.createElement('canvas'); cn.width=168; cn.height=188; d.appendChild(cn);
    const nm=document.createElement('div'); nm.className='nm'; d.appendChild(nm);
    const st=document.createElement('div'); st.className='st'; d.appendChild(st);
    d.addEventListener('click',()=>onCard(c));
    grid.appendChild(d); cards.push({c,d,cn,nm,st});
    thumb(cn,c);
  });
  refreshShop();
}
function refreshShop(){
  $('sCoin').textContent=save.coins; $('ownCnt').textContent=`${save.owned.length}/${CHARS.length}`;
  cards.forEach(k=>{ const own=save.owned.includes(k.c.id); k.d.classList.toggle('lock',!own); k.d.classList.toggle('sel',save.sel===k.c.id);
    k.nm.textContent=own?k.c.name:'???'; const s=charStatus(k.c); k.st.className='st '+s.cls; k.st.innerHTML=s.html; });
}
function onCard(c){
  SFX.click();
  if(save.owned.includes(c.id)){ save.sel=c.id; persist(); refreshShop(); toast(`${c.name}(으)로 바꿨어요!`); return; }
  if(c.best){ openModal(c,`🏆 ${c.best}계단을 오르면 열려요!`,[{t:'알겠어요',cls:'b-gray',fn:closeModal}],true); return; }
  if(save.coins<c.price){ openModal(c,`코인이 ${c.price-save.coins}개 부족해요`,[{t:'알겠어요',cls:'b-gray',fn:closeModal}],true); return; }
  openModal(c,`${c.name}을(를) ${c.price}코인에 살까요?`,[{t:'아니요',cls:'b-gray',fn:closeModal},{t:'살래요!',cls:'b-go',fn:()=>{save.coins-=c.price;save.owned.push(c.id);save.sel=c.id;persist();SFX.buy();closeModal();refreshShop();toast(`${c.name} 획득!`);}}]);
}
function gacha(){
  const pool=CHARS.filter(c=>!save.owned.includes(c.id)&&!c.best);
  if(!pool.length){ toast('뽑을 수 있는 캐릭터를 모두 모았어요!'); return; }
  if(save.coins<50){ toast(`코인이 ${50-save.coins}개 부족해요`); return; }
  save.coins-=50; persist(); refreshShop();
  const pick=pool[Math.floor(Math.random()*pool.length)];
  show('shop'); $('modal').classList.remove('hide'); $('mBtns').innerHTML=''; $('mText').textContent='두근두근...';
  const mc=$('mCanvas'), G=mc.getContext('2d'); let n=0;
  const iv=setInterval(()=>{ n++; const r=CHARS[Math.floor(Math.random()*CHARS.length)]; G.clearRect(0,0,300,340); drawChar(G,r,150,320,250,1,0,0); G.globalCompositeOperation='source-atop'; G.fillStyle='rgba(20,20,40,.85)'; G.fillRect(0,0,300,340); G.globalCompositeOperation='source-over'; SFX.roll();
    if(n>14){ clearInterval(iv); save.owned.push(pick.id); save.sel=pick.id; persist(); SFX.buy(); modalChar=pick; $('mText').textContent=`🎉 NEW! ${pick.name}`; setBtns([{t:'좋아요!',cls:'b-go',fn:()=>{closeModal();refreshShop();}}]); } },90);
}
let modalChar=null, modalLock=false;
function setBtns(arr){ const b=$('mBtns'); b.innerHTML=''; arr.forEach(o=>{const e=document.createElement('button');e.className='big '+o.cls;e.textContent=o.t;e.style.marginTop='12px';e.onclick=()=>{SFX.click();o.fn();};b.appendChild(e);}); }
function openModal(c,text,btns,lock){ modalChar=c; modalLock=!!lock; $('mText').textContent=text; setBtns(btns); $('modal').classList.remove('hide'); }
function closeModal(){ $('modal').classList.add('hide'); modalChar=null; }
(function modalLoop(){ if(modalChar && !$('modal').classList.contains('hide')){ const G=$('mCanvas').getContext('2d'); G.clearRect(0,0,300,340); drawChar(G,modalChar,150,322-Math.abs(Math.sin(now*4))*10,250,1,Math.sin(now*7)*0.3,now); if(modalLock){G.globalCompositeOperation='source-atop';G.fillStyle='rgba(20,20,40,.85)';G.fillRect(0,0,300,340);G.globalCompositeOperation='source-over';} } requestAnimationFrame(modalLoop); })();

function showRec(){
  const ul=$('recList'); ul.innerHTML='';
  if(!save.records.length) ul.innerHTML='<li style="justify-content:center;color:#7a86a3">아직 기록이 없어요. 도전해 보세요!</li>';
  save.records.forEach((r,i)=>{ const li=document.createElement('li'); const nm=(CMAP[r.c]||CHARS[0]).name;
    li.innerHTML=`<span class="rk">${['🥇','🥈','🥉'][i]||i+1}</span><span class="sc">${r.s}계단</span><span class="cn">${nm} · ${DIFF[r.m||0].name} · ${r.d}</span>`; ul.appendChild(li); });
  show('rec');
}

// 입력
function bindBtn(el,fn){ el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');fn();}); ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('down'))); }
bindBtn($('btnTurn'),()=>act(true));
bindBtn($('btnUp'),()=>act(false));
cv.addEventListener('pointerdown',e=>{ if(state!=='play') return; e.preventDefault(); act(e.clientX<W/2); });
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key;
  if(state==='play'){
    if(k==='ArrowLeft'||k==='z'||k==='Z'||k==='a'||k==='A'||k==='j'||k==='J'){e.preventDefault();act(true);press('btnTurn');}
    else if(k==='ArrowRight'||k==='ArrowUp'||k==='x'||k==='X'||k==='d'||k==='D'||k==='k'||k==='K'||k===' '){e.preventDefault();act(false);press('btnUp');}
    else if(k==='Escape'||k==='p'||k==='P') pauseGame();
  } else if((k==='Enter'||k===' ')&&(state==='menu'||state==='over')&&$('modal').classList.contains('hide')){ e.preventDefault(); if(state==='menu'&&!$('menu').classList.contains('hide')) startGame(); else if(state==='over') startGame(); }
});
function press(id){const b=$(id);b.classList.add('down');setTimeout(()=>b.classList.remove('down'),80);}
function pauseGame(){ if(state!=='play') return; state='pause'; show('pause'); }
$('btnPause').addEventListener('click',pauseGame);
$('btnResume').onclick=()=>{SFX.click(); show(null); state='play';};
$('btnQuit').onclick=()=>{SFX.click(); toMenu();};
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
$('btnStart').onclick=startGame;
$('btnRetry').onclick=startGame;
$('oMenu').onclick=()=>{SFX.click();toMenu();};
$('btnShop').onclick=()=>{ac();SFX.click();buildShop();show('shop');};
$('oShop').onclick=()=>{SFX.click();buildShop();show('shop');};
$('shopBack').onclick=()=>{SFX.click(); if(state==='over'){refreshMenu();toMenu();} else {refreshMenu();show('menu');}};
$('gachaBtn').onclick=()=>{ac();SFX.click();gacha();};
$('btnRec').onclick=()=>{ac();SFX.click();showRec();};
$('recBack').onclick=()=>{SFX.click();show('menu');};
$('pvPrev').onclick=()=>{ac();cyclePv(-1);};
$('pvNext').onclick=()=>{ac();cyclePv(1);};
$('diffSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; ac(); save.diff=+b.dataset.d; persist(); SFX.click(); refreshMenu();});
$('tgSnd').onclick=()=>{save.sound=!save.sound;persist();ac();SFX.click();refreshMenu();};
$('tgBgm').onclick=()=>{save.music=!save.music;persist();ac();SFX.click();refreshMenu();};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

// 시작
resetGame(); refreshMenu(); show('menu'); requestAnimationFrame(frame);

// 오프라인 지원 (웹에 올렸을 때 한 번 접속하면 이후 비행기 모드에서도 실행)
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
