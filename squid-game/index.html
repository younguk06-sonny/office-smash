<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>1학년 1반 서바이벌</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;background:#1b1530;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;justify-content:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
h1{font-size:30px;letter-spacing:-1px;white-space:nowrap;text-align:center;line-height:1.15}
h2{font-size:22px;letter-spacing:-.5px;white-space:nowrap;margin:6px 0 12px}
.sub{color:#ffb3cf;font-size:14px;white-space:nowrap;letter-spacing:-.3px;margin-top:6px}
.btn{border:0;border-radius:18px;font-weight:800;color:#fff;font-size:20px;padding:14px 22px;background:#ff3d7f;box-shadow:0 5px 0 #b3134b;white-space:nowrap;letter-spacing:-.5px;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b3134b}
.btn.teal{background:#13b3a2;box-shadow:0 5px 0 #0a7468}
.btn.teal:active{box-shadow:0 2px 0 #0a7468}
.btn.gray{background:#4b4366;box-shadow:0 5px 0 #2d2742}
.btn.gray:active{box-shadow:0 2px 0 #2d2742}
.btn:disabled{opacity:.35}
#titleCv{width:100%;flex:1;min-height:0}
.shapes{font-size:26px;letter-spacing:10px;color:#ff3d7f;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:6px;overflow-y:auto;min-height:0}
.card{background:#2b2347;border-radius:18px;padding:6px 4px 8px;text-align:center;border:3px solid transparent;cursor:pointer;transition:transform .12s}
.card.sel{border-color:#ff3d7f;background:#3b2b55;transform:scale(1.04)}
.card canvas{width:100%;aspect-ratio:1/1;display:block}
.card b{display:block;font-size:17px;white-space:nowrap;letter-spacing:-.6px}
.card b.long{font-size:14px;letter-spacing:-1px}
.card{position:relative}.card em{display:none;position:absolute;top:6px;right:8px;font-style:normal;background:#ff3d7f;border-radius:50%;width:24px;height:24px;line-height:24px;font-size:14px;font-weight:900}.card.sel em{display:block}
.card small{color:#bbaee0;font-size:12px;white-space:nowrap}
.games{display:flex;flex-direction:column;gap:12px;width:100%}
.gcard{display:flex;align-items:center;gap:12px;background:#2b2347;border-radius:20px;padding:12px 14px;cursor:pointer;border:3px solid transparent}
.gcard:active{transform:scale(.98)}
.gcard .ic{font-size:40px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:16px;flex:none}
.gcard b{font-size:19px;white-space:nowrap;letter-spacing:-.6px;display:block}
.gcard span{font-size:13px;color:#cfc4ee;letter-spacing:-.4px;display:block;line-height:1.35;margin-top:2px}
.seg{display:flex;background:#2b2347;border-radius:14px;padding:4px;gap:4px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:transparent;color:#cfc4ee;font-size:16px;font-weight:800;padding:9px 16px;border-radius:11px;white-space:nowrap;font-family:inherit;letter-spacing:-.4px}
.seg button.on{background:#ff3d7f;color:#fff}
.me{display:flex;align-items:center;gap:8px;font-size:15px;color:#cfc4ee;white-space:nowrap}
.me canvas{width:40px;height:46px}
#sPlay{padding:0;max-width:none}
#stage{position:relative;flex:1;width:100%;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hudTop{position:absolute;left:0;right:0;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;padding:0 10px;pointer-events:none}
.pill{background:rgba(20,14,40,.72);border-radius:14px;padding:6px 12px;font-weight:800;font-size:16px;white-space:nowrap;letter-spacing:-.4px}
.ibtn{pointer-events:auto;border:0;background:rgba(20,14,40,.72);color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;font-family:inherit}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;background:rgba(20,14,40,.88);border:3px solid #ff3d7f;border-radius:22px;padding:14px 22px;text-align:center;transition:all .22s cubic-bezier(.2,1.6,.4,1);max-width:92%}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner b{display:block;font-size:30px;white-space:nowrap;letter-spacing:-1px}
#banner span{display:block;font-size:15px;color:#ffd2e2;margin-top:4px;letter-spacing:-.4px;white-space:nowrap}
#ctrl{width:100%;max-width:560px;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#1b1530;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.bigbtn{border:0;border-radius:22px;height:92px;font-size:28px;font-weight:900;color:#fff;background:#ff3d7f;box-shadow:0 6px 0 #b3134b;font-family:inherit;white-space:nowrap;letter-spacing:-1px;touch-action:none}
.bigbtn.held,.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b3134b;background:#ff5a93}
.bigbtn.teal{background:#13b3a2;box-shadow:0 6px 0 #0a7468}
.bigbtn.orange{background:#ff8a1f;box-shadow:0 6px 0 #b35500}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:0;border-radius:16px;height:62px;background:#3b3160;color:#fff;font-family:inherit;font-weight:800;font-size:13px;letter-spacing:-.6px;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 4px 0 #241d3d;touch-action:none}
.act i{font-style:normal;font-size:24px;line-height:1}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 #241d3d}
.act.hint{background:#ffcf33;color:#3a2600;box-shadow:0 4px 0 #b38900;animation:pulse .6s infinite alternate}
.act.ok{background:#13b3a2;box-shadow:0 4px 0 #0a7468}
@keyframes pulse{to{transform:scale(1.07)}}
.friends{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.friend{border:0;border-radius:16px;height:92px;background:#3b3160;color:#fff;font-family:inherit;font-weight:800;font-size:15px;letter-spacing:-.7px;white-space:nowrap;box-shadow:0 4px 0 #241d3d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.friend canvas{width:38px;height:44px}
.friend:active{transform:translateY(3px)}
.friend.go{background:#ff8a1f;box-shadow:0 4px 0 #b35500;animation:pulse .5s infinite alternate}
.friend:disabled{opacity:.3;animation:none}
.msg{text-align:center;font-weight:800;font-size:17px;color:#ffd2e2;white-space:nowrap;letter-spacing:-.5px;height:92px;display:flex;align-items:center;justify-content:center;background:#2b2347;border-radius:22px}
#rank{width:100%;display:flex;flex-direction:column;gap:8px;margin:6px 0 16px}
.row{display:flex;align-items:center;gap:10px;background:#2b2347;border-radius:16px;padding:6px 12px}
.row.me1{background:#4a2a5a;border:2px solid #ff3d7f}
.row .md{font-size:26px;width:36px;text-align:center;flex:none}
.row canvas{width:44px;height:51px;flex:none}
.row b{font-size:18px;white-space:nowrap;letter-spacing:-.5px}
.row span{margin-left:auto;font-size:14px;color:#cfc4ee;white-space:nowrap;letter-spacing:-.4px}
.btns{display:flex;flex-direction:column;gap:12px;width:100%}
.big-emoji{font-size:58px;line-height:1;margin:8px 0 2px}
.hint-text{font-size:13px;color:#a99cd0;margin-top:10px;white-space:nowrap;letter-spacing:-.4px}
.flexfill{flex:1}
</style>
</head>
<body>
<div id="app">

<section id="sTitle" class="screen on">
  <div class="shapes">○ △ □</div>
  <h1>1학년 1반<br>서바이벌</h1>
  <div class="sub">무궁화꽃 · 꼬마야 줄넘기 · 폭탄돌리기</div>
  <canvas id="titleCv"></canvas>
  <div class="btns">
    <button class="btn" id="bStart">게임 시작</button>
  </div>
  <div class="hint-text">인터넷 없이도 할 수 있어요</div>
</section>

<section id="sChar" class="screen">
  <h2>내 캐릭터를 골라요</h2>
  <div class="grid" id="charGrid"></div>
  <div class="flexfill"></div>
  <div class="sub" style="margin-bottom:10px">다음 화면에서 대결할 친구를 골라요</div>
  <div class="btns"><button class="btn" id="bCharOk">이 친구로 할래!</button></div>
</section>

<section id="sOpp" class="screen">
  <h2>누구랑 대결할까?</h2>
  <div class="sub" id="oppMsg" style="margin:-6px 0 4px">최대 4명까지 골라요</div>
  <div class="grid" id="oppGrid"></div>
  <div class="flexfill"></div>
  <div class="btns" style="flex-direction:row"><button class="btn gray" id="bRandOpp" style="flex:none">🎲 무작위</button><button class="btn" id="bOppOk" style="flex:1">대결 시작!</button></div>
</section>

<section id="sGame" class="screen">
  <div class="me" id="meBox"></div>
  <h2>어떤 게임을 할까?</h2>
  <div class="seg" id="diffSeg">
    <button data-d="easy">쉬움</button><button data-d="normal" class="on">보통</button><button data-d="hard">어려움</button>
  </div>
  <div class="games">
    <div class="gcard" data-g="g1"><div class="ic" style="background:#ffd9e6">🌸</div><div><b>무궁화꽃이 피었습니다</b><span>버튼을 꾹 누르면 달려요.<br>술래봇이 돌아보면 손을 떼요!</span></div></div>
    <div class="gcard" data-g="g2"><div class="ic" style="background:#d6f5f1">🪢</div><div><b>꼬마야 꼬마야 줄넘기</b><span>줄이 발밑에 올 때 점프!<br>노래에 맞춰 동작도 해요.</span></div></div>
    <div class="gcard" data-g="g3"><div class="ic" style="background:#ffe6c9">💣</div><div><b>폭탄돌리기</b><span>폭탄을 톡톡 눌러서 친구에게!<br>시간은 아무도 몰라요.</span></div></div>
  </div>
  <div class="flexfill"></div>
  <div class="btns"><button class="btn gray" id="bBackChar">캐릭터·상대 바꾸기</button></div>
</section>

<section id="sPlay" class="screen">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hudTop"><div class="pill" id="hudL">&nbsp;</div><div style="display:flex;gap:6px"><div class="pill" id="hudR" style="display:none"></div><button class="ibtn" id="bSnd">🔊</button><button class="ibtn" id="bQuit">✕</button></div></div>
    <div id="banner"><b></b><span></span></div>
  </div>
  <div id="ctrl"></div>
</section>

<section id="sResult" class="screen">
  <div class="big-emoji" id="resEmoji">🏆</div>
  <h2 id="resTitle">결과</h2>
  <div id="rank"></div>
  <div class="flexfill"></div>
  <div class="btns">
    <button class="btn" id="bAgain">한 번 더!</button>
    <button class="btn teal" id="bOther">다른 게임 하기</button>
  </div>
</section>

</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------------- 캐릭터 ---------------- */
const CHARS=[
 {name:'이화정 선생님',short:'선생님',num:'000',suit:'#5f8f6e',hair:'#3a2a22',style:'perm',acc:'#ffd23f',adult:true,skin:'#f5d2b6'},
 {name:'김승현',num:'001',suit:'#2fbf71',hair:'#1e1612',style:'chubby',acc:'#ffffff',skin:'#f3cdaa'},
 {name:'장도윤',num:'006',suit:'#ff4646',hair:'#151010',style:'boy',acc:'#ffffff',skin:'#d29a6c',runner:true},
 {name:'김은경',num:'008',suit:'#ff7a2e',hair:'#24150c',style:'buns',acc:'#5ad1ff'},
 {name:'류아윤',num:'011',suit:'#9b6bff',hair:'#4a2817',style:'long',acc:'#7ef0c8'},
 {name:'변예서',num:'013',suit:'#ffbf1f',hair:'#3b2114',style:'ponytail',acc:'#ff4d6d'},
 {name:'손리안',num:'014',suit:'#ff5c9d',hair:'#2a170e',style:'long',acc:'#ffffff',pin:'#ff8fc0'},
 {name:'이세아',num:'015',suit:'#38a8ff',hair:'#16131c',style:'bob',acc:'#ffd23f'},
 {name:'이하윤',num:'018',suit:'#2c3e75',hair:'#1a1410',style:'neat',acc:'#ffffff'},
];
const nm=ci=>CHARS[ci].short||CHARS[ci].name;
const byNum=n=>CHARS.findIndex(c=>c.num===n);
const S={player:byNum('014'),opp:[],diff:'normal',game:'g1',sound:true};
try{const sv=JSON.parse(localStorage.getItem('sq1_settings2')||'{}');if(sv.player&&byNum(sv.player)>=0)S.player=byNum(sv.player);if(Array.isArray(sv.opp))S.opp=sv.opp.map(byNum).filter(i=>i>=0&&i!==S.player).slice(0,4);if(sv.diff)S.diff=sv.diff;if(sv.sound===false)S.sound=false}catch(e){}
function saveSettings(){try{localStorage.setItem('sq1_settings2',JSON.stringify({player:CHARS[S.player].num,opp:S.opp.map(i=>CHARS[i].num),diff:S.diff,sound:S.sound}))}catch(e){}}
function randOpp(){S.opp=shuffle(CHARS.map((c,i)=>i).filter(i=>i!==S.player)).slice(0,4)}
if(!S.opp.length)randOpp();
/* 참가자 배치: 내가 가운데 */
function lineup(){const o=S.opp.slice();const mid=Math.floor((o.length+1)/2);o.splice(mid,0,S.player);return o}

function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return `rgb(${r},${g},${b})`}
function rr(g,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2)}
function bow(g,x,y,s,col){g.save();g.translate(x,y);g.fillStyle=col;g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=s*.12;g.beginPath();g.moveTo(0,0);g.lineTo(-s,-s*.7);g.lineTo(-s,s*.7);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(s,-s*.7);g.lineTo(s,s*.7);g.closePath();g.fill();g.stroke();circ(g,0,0,s*.35);g.fill();g.restore()}

/* 캐릭터 그리기: (x,y)=발 아래 중심, s=키(px) */
function drawGirl(g,x,y,s,c,o){
  o=o||{};const u=s/100,pose=o.pose||'stand',ph=o.phase||0;
  const skin=c.skin||'#ffdcc4',suit=c.suit,dark=c.adult?'#3b4a6b':shade(c.suit,-.28);
  g.save();g.translate(x,y);
  if(o.alpha!=null)g.globalAlpha=o.alpha;
  if(o.shadow!==false){g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(0,0,20*u*(o.shadowK||1),5*u*(o.shadowK||1),0,0,Math.PI*2);g.fill()}
  if(o.lift)g.translate(0,-o.lift);
  if(o.lie){g.rotate(o.lie*Math.PI/2*(o.lieDir||1))}
  if(o.flip)g.scale(-1,1);
  if(c.adult)g.scale(1.14,1.14);
  let crouch=pose==='ground'?13*u:pose==='sit'?20*u:0;
  let la=0,ra=0;
  if(pose==='run'){la=Math.sin(ph)*.55;ra=-la}
  else if(pose==='jump'){la=.45;ra=-.45}
  else if(pose==='sit'){la=1.25;ra=-1.25}
  else if(pose==='ground'){la=.6;ra=-.6}
  else if(pose==='manse'||pose==='cheer'){la=.12;ra=-.12}
  const legLen=26*u-crouch*.35;
  const leg=(hx,a)=>{g.save();g.translate(hx,-30*u+crouch);g.rotate(a);g.fillStyle=dark;rr(g,-5*u,0,10*u,legLen,4*u);g.fill();g.fillStyle='#fff';rr(g,-6*u,legLen-3*u,13*u,7*u,3.5*u);g.fill();g.fillStyle=c.acc==='#ffffff'?'#ff5c9d':c.acc;g.fillRect(-6*u,legLen+1.5*u,13*u,1.6*u);g.restore()};
  leg(-7*u,la);leg(7*u,ra);
  g.translate(0,crouch);
  // 뒷머리
  g.fillStyle=c.hair;
  if(c.style==='long'){rr(g,-21*u,-84*u,42*u,48*u,13*u);g.fill()}
  if((c.style==='bob'||c.style==='neat')&&o.back){rr(g,-22*u,-92*u,44*u,32*u,14*u);g.fill()}
  if(c.style==='perm'){for(let k=0;k<14;k++){const a=Math.PI*(.75+k*.115);circ(g,Math.cos(a)*21*u,-78*u+Math.sin(a)*21*u,7.5*u);g.fill()}}
  // 몸통
  g.fillStyle=suit;rr(g,-16*u,-58*u,32*u,32*u,9*u);g.fill();
  if(c.adult){g.fillStyle='#3b4a6b';g.beginPath();g.moveTo(-15*u,-31*u);g.lineTo(15*u,-31*u);g.lineTo(19*u,-13*u);g.lineTo(-19*u,-13*u);g.closePath();g.fill();
    g.fillStyle=shade(suit,-.15);g.fillRect(-2*u,-58*u,4*u,28*u);[-50,-43,-36].forEach(yy=>{g.fillStyle='#fff';circ(g,0,yy*u,1.3*u);g.fill()})}
  else{g.fillStyle='rgba(255,255,255,.9)';g.fillRect(-14.5*u,-55*u,3*u,27*u);g.fillRect(11.5*u,-55*u,3*u,27*u)}
  if(!o.back){
    g.fillStyle='#fff';g.beginPath();g.moveTo(-7*u,-58*u);g.lineTo(0,-50*u);g.lineTo(7*u,-58*u);g.closePath();g.fill();
    g.fillStyle='#fff';rr(g,-8*u,-46*u,16*u,10*u,2.5*u);g.fill();
    g.fillStyle='#222';g.font=`900 ${7.6*u}px sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(c.num,0,-40.6*u);
  }
  // 팔
  let a1=.2,a2=-.2;
  if(pose==='run'){a1=.25+Math.sin(ph)*.7;a2=-.25+Math.sin(ph)*.7}
  else if(pose==='jump'){a1=1.25;a2=-1.25}
  else if(pose==='clap'){const k=(Math.sin(ph)+1)/2;a1=-2.15+k*.45;a2=2.15-k*.45}
  else if(pose==='manse'){a1=2.75;a2=-2.75}
  else if(pose==='cheer'){a1=2.6+Math.sin(ph)*.25;a2=-2.6+Math.sin(ph+1)*.25}
  else if(pose==='ground'){a1=-.15;a2=.15}
  else if(pose==='sit'){a1=.5;a2=-.5}
  else if(pose==='hold'){a1=-.95;a2=.95}
  else if(pose==='throw'){a1=-1.9;a2=-2.6}
  else if(pose==='stop'){a1=.05;a2=-.05}
  const arm=(sx,a)=>{g.save();g.translate(sx,-54*u);g.rotate(a);g.fillStyle=suit;rr(g,-4.2*u,-2*u,8.4*u,22*u,4.2*u);g.fill();g.fillStyle=skin;circ(g,0,22*u,4.6*u);g.fill();g.restore()};
  arm(-15*u,a1);arm(15*u,a2);
